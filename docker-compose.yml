services:
  postgres:
    image: postgres:17.6-alpine
    environment: { POSTGRES_USER: buildweave, POSTGRES_PASSWORD: buildweave, POSTGRES_DB: buildweave }
    ports: ["54329:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U buildweave"], interval: 2s, timeout: 2s, retries: 20 }
    volumes: ["pg-data:/var/lib/postgresql/data"]
  postgres-init:
    image: postgres:17.6-alpine
    depends_on: { postgres: { condition: service_healthy } }
    environment: { PGPASSWORD: buildweave }
    volumes: ["./internal/metadata/schema.sql:/schema.sql:ro"]
    command: ["psql", "-h", "postgres", "-U", "buildweave", "-d", "buildweave", "-f", "/schema.sql"]
    restart: "no"
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: buildweave, MINIO_ROOT_PASSWORD: buildweave-secret }
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c", "until mc alias set local http://minio:9000 buildweave buildweave-secret; do sleep 1; done; mc mb --ignore-existing local/buildweave"]
    restart: "no"
volumes: { pg-data: {}, minio-data: {} }
